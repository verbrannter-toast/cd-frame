# Home Assistant configuration for the CD frame.
# MERGE these blocks into your existing configuration.yaml — YAML does not allow the
# same top-level key twice, so if you already have e.g. `rest_command:` or `input_text:`,
# add the entries underneath the existing key instead of pasting a second one.
#
# Also create ONE helper in the UI (Settings > Devices & Services > Helpers > Create Helper > Dropdown):
#   name "Loaded Album" -> entity id input_select.loaded_album
# (the UI wants at least one option; add any placeholder, the catalog service overwrites the list)
#
# Paths below are as seen INSIDE the HA container: <host config dir> is mounted at /config.

# --- Talk to the catalog service on the Pi (HA runs with network_mode: host) ---
# If HA is in bridge mode, replace localhost with the Pi's LAN IP.
rest_command:
  catalog_album:
    url: "http://localhost:5005/catalog"
    method: POST
    content_type: "application/json"
    payload: '{"artist": "{{ artist }}", "album": "{{ album }}"}'
  search_album:
    url: "http://localhost:5005/search"
    method: POST
    content_type: "application/json"
    payload: '{"artist": "{{ artist }}", "album": "{{ album }}"}'
  confirm_album:
    url: "http://localhost:5005/confirm"
    method: POST
    content_type: "application/json"
    payload: '{"artist": "{{ artist }}", "album": "{{ album }}", "mbid": "{{ mbid }}"}'

# --- Read the catalog files back into HA ---
# Current HA requires the `command_line:` key; the old `sensor: - platform: command_line`
# style is rejected and the entity silently never appears.
command_line:
  - sensor:
      name: Album Catalog
      command: "cat /config/www/albums/index.json"
      value_template: "{{ value_json.albums | length }}"
      json_attributes:
        - albums
      scan_interval: 60
  - sensor:
      name: Search Results
      command: "cat /config/www/albums/search_results.json"
      value_template: "{{ value_json.candidates | length }}"
      json_attributes:
        - candidates
      scan_interval: 10

# --- Form fields + picker ---
input_text:
  catalog_artist:
    name: Artist to catalog
  catalog_album_title:
    name: Album to catalog
  # Optional: used by automations.example.yaml to restore the selection after an HA restart
  loaded_album_memory:
    name: Last loaded album
    max: 255

input_number:
  search_result_choice:
    name: Search Result to Confirm
    min: 1
    max: 10
    step: 1

# Scripts: if your configuration.yaml has `script: !include scripts.yaml`, put the scripts from
# scripts.example.yaml into scripts.yaml — do NOT add a second `script:` key here.
