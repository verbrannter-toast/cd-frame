<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 520" width="1260" height="520" role="img" aria-labelledby="t d">
<title id="t">CD Frame: how it works</title>
<desc id="d">Home Assistant asks a catalog service to look up albums on MusicBrainz and the Cover Art Archive. The service writes tracklists and covers to a shared folder. The ESP32 polls Home Assistant for the selected album, fetches the files over HTTP and shows them on an e-paper display. The CD player is not connected to the ESP32.</desc>
<style>
:root{--bg:#ffffff;--surface:#f6f8fa;--line:#d0d7de;--text:#1f2328;--muted:#656d76;--accent:#0969da;--accent-bg:#ddf4ff;--arrow:#57606a;--badge-text:#ffffff}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--surface:#161b22;--line:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--accent-bg:#102a43;--arrow:#8b949e;--badge-text:#0d1117}}
svg{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.bg{fill:var(--bg)}
.box{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.pi{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:2 5;stroke-linecap:round}
.hl{fill:var(--accent-bg);stroke:var(--accent);stroke-width:1.5}
.title{fill:var(--text);font-size:16px;font-weight:600}
.sub{fill:var(--muted);font-size:12.5px}
.lbl{fill:var(--text);font-size:12.5px}
.lblm{fill:var(--muted);font-size:12px}
.zone{fill:var(--accent);font-size:12.5px;font-weight:600;letter-spacing:.04em}
.arrow{stroke:var(--arrow);stroke-width:1.6;fill:none}
.arrow.thin{stroke-width:1.2}
.ah{fill:var(--arrow)}
.badge{fill:var(--accent)}
.badget{fill:var(--badge-text);font-size:12px;font-weight:700}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0 0 L10 5 L0 10 z"/></marker></defs>
<rect class="bg" width="1260" height="520"/>
<rect class="pi" x="330" y="100" width="590" height="380" rx="14"/>
<text class="zone" x="348" y="124">RASPBERRY PI</text>
<rect class="box" x="20" y="150" width="200" height="100" rx="10"/>
<text class="title" x="120.0" y="178" text-anchor="middle">MusicBrainz</text>
<text class="sub" x="120.0" y="200" text-anchor="middle">+ Cover Art Archive</text>
<text class="sub" x="120.0" y="218" text-anchor="middle">public APIs</text>
<rect class="box" x="360" y="150" width="200" height="100" rx="10"/>
<text class="title" x="460.0" y="178" text-anchor="middle">Catalog service</text>
<text class="sub" x="460.0" y="200" text-anchor="middle">Flask on the host</text>
<text class="sub" x="460.0" y="218" text-anchor="middle">127.0.0.1:5005</text>
<rect class="hl" x="700" y="150" width="200" height="100" rx="10"/>
<text class="title" x="800.0" y="178" text-anchor="middle">Home Assistant</text>
<text class="sub" x="800.0" y="200" text-anchor="middle">Docker container</text>
<text class="sub" x="800.0" y="218" text-anchor="middle">input_select.loaded_album</text>
<rect class="box" x="360" y="340" width="540" height="100" rx="10"/>
<text class="title" x="630.0" y="368" text-anchor="middle">&lt;HA config&gt;/www/albums/</text>
<text class="sub" x="630.0" y="390" text-anchor="middle">index.json</text>
<text class="sub" x="630.0" y="408" text-anchor="middle">&lt;slug&gt;/tracks.json  ·  cover.raw  ·  cover_full.jpg</text>
<rect class="box" x="700" y="20" width="200" height="44" rx="10"/>
<text class="title" x="800" y="48" text-anchor="middle">You (dashboard)</text>
<rect class="box" x="20" y="340" width="200" height="110" rx="10" stroke-dasharray="6 4"/>
<text class="title" x="120.0" y="368" text-anchor="middle">CD player</text>
<text class="sub" x="120.0" y="390" text-anchor="middle">Bluetooth audio → speakers</text>
<text class="sub" x="120.0" y="408" text-anchor="middle">no data link to the ESP32</text>
<rect class="box" x="1020" y="120" width="220" height="310" rx="10"/>
<text class="title" x="1130" y="148" text-anchor="middle">ESP32-C3 Supermini</text>
<text class="sub" x="1130" y="168" text-anchor="middle">WiFi · per-track timer</text>
<rect class="hl" x="1040" y="255" width="180" height="150" rx="8"/>
<text class="title" x="1130" y="283" text-anchor="middle">E-paper 2.13"</text>
<text class="sub" x="1130" y="306" text-anchor="middle">cover art</text>
<text class="sub" x="1130" y="326" text-anchor="middle">artist · album</text>
<text class="sub" x="1130" y="346" text-anchor="middle">current track</text>
<line class="arrow" x1="1130" y1="180" x2="1130" y2="252" marker-end="url(#ah)"/>
<text class="lblm" x="1142" y="220" text-anchor="start">SPI</text>
<line class="arrow" x1="800" y1="64" x2="800" y2="150" marker-end="url(#ah)"/>
<text class="lblm" x="812" y="92" text-anchor="start">pick the disc, add albums</text>
<line class="arrow" x1="700" y1="190" x2="560" y2="190" marker-end="url(#ah)"/>
<circle class="badge" cx="630" cy="190" r="10"/>
<text class="badget" x="630" y="194" text-anchor="middle">1</text>
<text class="lbl" x="630" y="172" text-anchor="middle">rest_command</text>
<line class="arrow" x1="560" y1="232" x2="700" y2="232" marker-end="url(#ah)"/>
<circle class="badge" cx="630" cy="232" r="10"/>
<text class="badget" x="630" y="236" text-anchor="middle">4</text>
<text class="lbl" x="630" y="214" text-anchor="middle">set_options</text>
<line class="arrow" x1="220" y1="200" x2="360" y2="200" marker-end="url(#ah)"/>
<circle class="badge" cx="290" cy="200" r="10"/>
<text class="badget" x="290" y="204" text-anchor="middle">2</text>
<text class="lbl" x="290" y="222" text-anchor="middle">tracklist, durations,</text>
<text class="lbl" x="290" y="238" text-anchor="middle">cover art</text>
<line class="arrow" x1="460" y1="250" x2="460" y2="340" marker-end="url(#ah)"/>
<circle class="badge" cx="460" cy="295" r="10"/>
<text class="badget" x="460" y="299" text-anchor="middle">3</text>
<text class="lbl" x="478" y="299" text-anchor="start">write files</text>
<line class="arrow thin" x1="800" y1="340" x2="800" y2="250" marker-end="url(#ah)"/>
<text class="lblm" x="790" y="297" text-anchor="end">sensors read index.json</text>
<line class="arrow" x1="1020" y1="185" x2="900" y2="185" marker-end="url(#ah)"/>
<circle class="badge" cx="960" cy="185" r="10"/>
<text class="badget" x="960" y="189" text-anchor="middle">5</text>
<text class="lbl" x="960" y="164" text-anchor="middle">polls state</text>
<text class="lblm" x="960" y="214" text-anchor="middle">every 15 s</text>
<line class="arrow" x1="1020" y1="395" x2="900" y2="395" marker-end="url(#ah)"/>
<circle class="badge" cx="960" cy="395" r="10"/>
<text class="badget" x="960" y="399" text-anchor="middle">6</text>
<text class="lbl" x="960" y="374" text-anchor="middle">fetches files</text>
<text class="lblm" x="960" y="424" text-anchor="middle">over HTTP</text>
</svg>